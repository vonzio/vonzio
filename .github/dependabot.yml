version: 2

# npm updates come from the WORKSPACE ROOT only. Per-subdirectory npm entries
# (the previous config) bump a workspace's package.json without regenerating
# the root package-lock.json, so every such PR permanently failed the
# lockfile gate — see issue #352 and the 6-week unmergeable backlog it caused.
# From the root, Dependabot maintains the lockfile coherently across all
# workspaces, and .github/workflows/dependabot-automerge.yml auto-merges
# minor/patch PRs once CI is green — majors and the runtime-critical agent
# SDK always wait for a human.
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 6
    labels:
      - dependencies
    commit-message:
      prefix: "deps"
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
        # Runtime-critical: the SDK powers every agent container. Excluded
        # from the group so its bumps arrive as their OWN PR — validate with
        # a rebuilt agent image + `make e2e-chat` before merging (the
        # auto-merge workflow also skips it explicitly).
        exclude-patterns:
          - "@anthropic-ai/claude-agent-sdk*"
          - "agent-browser"

  # GitHub Actions versions (CI workflows).
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    labels:
      - ci
    commit-message:
      prefix: "ci"

  # Docker base images (node:22-slim, etc.) — major bumps only, monthly.
  # Never auto-merged: base-image majors need an image rebuild + e2e pass.
  - package-ecosystem: docker
    directory: /docker
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    labels:
      - dependencies
      - docker
    commit-message:
      prefix: "deps(docker)"
