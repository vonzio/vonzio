name: release

# Triggered when a v* tag is pushed. Gated on the full E2E, then: creates a
# GitHub release (auto-generated notes from PR titles since the previous tag)
# and publishes the plugin SDK to npm (in parallel); once the release is made,
# publishes the multi-arch runtime images to GHCR so installs pull, not build.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write   # required to create a GitHub release

jobs:
  # Blocking pre-publish gate: run the full E2E (first-run + chat round-trip
  # against a real agent container + mock LLM) on the exact tagged commit. The
  # per-PR first-run smoke is path-filtered, so a tag can sit on a main where it
  # never ran — this closes that gap and verifies the whole critical journey
  # before any artifact ships. `release` + `publish-sdk` need it, so a red E2E
  # stops the release.
  e2e-gate:
    name: e2e gate
    # Canonical publish pipeline — only the upstream OSS repo cuts releases and
    # publishes the runtime images + npm SDK. On a fork or the cloud mirror
    # (which ships via its own deploy.yml) every job below is skipped, so this
    # whole workflow is a no-op there instead of failing/double-publishing.
    if: ${{ github.repository == 'vonzio/vonzio' }}
    uses: ./.github/workflows/e2e-full.yml

  release:
    name: GitHub release
    needs: e2e-gate
    if: ${{ github.repository == 'vonzio/vonzio' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      # Bare version (no leading "v") — reused by publish-images below. This is
      # the tag the runtime images get AND what the installer pulls:
      # install.sh strips the "v" (server:${RESOLVED_REF#v}).
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0   # need full history for release-notes generation

      - name: Read version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # GitHub's --generate-notes pulls in commit/PR titles since the
          # previous tag. We prepend a static intro pointing users at the
          # install one-liner so the top of the release page is useful even
          # when commit messages aren't.
          notes_file="$(mktemp)"
          cat >"$notes_file" <<EOF
          ## vonzio core ${{ steps.version.outputs.version }}

          Self-hostable Claude Code agent runtime + dashboard.

          ### Install

          \`\`\`bash
          curl -fsSL https://raw.githubusercontent.com/vonzio/vonzio/main/install.sh | bash
          \`\`\`

          Full guide: [docs/SELF_HOST.md](https://github.com/vonzio/vonzio/blob/main/docs/SELF_HOST.md).

          ---

          ### What changed
          EOF

          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes-file "$notes_file" \
            --generate-notes

  publish-images:
    # Publish the multi-arch runtime images (agent-base → agent, server) to GHCR
    # at the release version so installs PULL instead of build. Runs only after
    # the GitHub release is created (needs: release), so a tag that fails to
    # release doesn't leave dangling images — and reuses release's bare version
    # output as the image tag. The reusable workflow needs packages:write, which
    # this job grants explicitly (the top-level token is contents:write only).
    name: publish runtime images to GHCR
    needs: release
    if: ${{ github.repository == 'vonzio/vonzio' }}
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/publish-images.yml
    with:
      version: ${{ needs.release.outputs.version }}
    secrets: inherit

  publish-sdk:
    # Publish the plugin SDK packages to npm so external plugins (separate
    # repos) can `npm install @vonzio/plugin-api` + `@vonzio/dashboard-registry`.
    # Each package publishes at its
    # own package.json version, independent of the v* app tag — idempotent: a
    # version already on npm is skipped, so app releases that didn't bump the SDK
    # are no-ops. Bumping an SDK package.json version + pushing a v* tag ships it.
    name: publish plugin SDK to npm
    needs: e2e-gate
    if: ${{ github.repository == 'vonzio/vonzio' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          registry-url: "https://registry.npmjs.org"
      - run: npm ci
      - name: Build + publish @vonzio/shared then @vonzio/plugin-api
        env:
          # Set NPM_TOKEN in the repo's Actions secrets (an npm automation token).
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          publish_pkg() {
            local dir="$1"
            ( cd "$dir" && npm run prepare-dist )
            local name version
            name="$(node -p "require('./$dir/dist/package.json').name")"
            version="$(node -p "require('./$dir/dist/package.json').version")"
            if npm view "$name@$version" version >/dev/null 2>&1; then
              echo "::notice::$name@$version already on npm — skipping"
            else
              echo "publishing $name@$version"
              ( cd "$dir/dist" && npm publish --access public )
            fi
          }
          # Order matters: shared is a dependency of plugin-api. dashboard-
          # registry has no @vonzio deps (only react/lucide-react peers).
          publish_pkg packages/shared
          publish_pkg packages/plugin-api
          publish_pkg packages/dashboard-registry
          publish_pkg packages/dictation
