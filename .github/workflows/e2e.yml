name: e2e

# Browser-level first-run smoke against the real dockerized OSS stack. GATED —
# not part of every-PR required checks — because booting the full stack costs a
# few minutes. Runs only when the FE / API / stack / suite itself changes, plus
# on-demand. See e2e/README.md.
on:
  pull_request:
    branches: [main]
    paths:
      - "packages/dashboard/**"
      - "packages/core-server/**"
      - "docker/**"
      - "e2e/**"
      - ".github/workflows/e2e.yml"
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: first-run smoke (dockerized stack)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
      # npm install (NOT npm ci): the lockfile is darwin-generated and npm bug
      # #4828 makes `npm ci` skip a linux-only native binding — same reason the
      # rest of CI uses install. Lock drift is caught separately (check-lockfile).
      - run: npm install
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Generate a fresh .env (random secrets)
        run: |
          cp .env.example .env
          sed -i "s|^ENCRYPTION_KEY=.*|ENCRYPTION_KEY=$(openssl rand -hex 16)|" .env
          sed -i "s|^BETTER_AUTH_SECRET=.*|BETTER_AUTH_SECRET=$(openssl rand -hex 32)|" .env
          sed -i "s|^POSTGRES_PASSWORD=.*|POSTGRES_PASSWORD=$(openssl rand -hex 16)|" .env

      # Build ONLY the server image. `server` has `depends_on: agent`, and the
      # agent image does `FROM ghcr.io/.../agent-base` — a private/heavy base
      # that 401s for an anonymous pull in CI. The first-run smoke never spawns
      # an agent, so we skip it entirely (naming `server` keeps bake from
      # building the agent target too).
      - name: Build the server image
        working-directory: docker
        run: |
          docker compose --env-file ../.env \
            -f docker-compose.yml -f docker-compose.dev.yml \
            build server

      # The server's boot preflight (index.ts) inspects AGENT_IMAGE and exit(1)s
      # if it's missing — it never *runs* an agent for the first-run smoke, but
      # the existence check is unconditional under DOCKER_ENABLED. Tag a tiny
      # image as vonzio-agent:latest to satisfy the inspect without building the
      # heavy (and private-base) agent image. The placeholder is never executed.
      - name: Provide a placeholder agent image
        run: |
          docker pull -q node:22-slim
          docker tag node:22-slim vonzio-agent:latest

      # --no-deps so `depends_on: agent` doesn't drag the agent service in;
      # --no-build because we just built. Start exactly the 3 the smoke needs.
      - name: Boot fresh OSS stack (postgres + proxy + server; no agent)
        working-directory: docker
        run: |
          docker compose --env-file ../.env \
            -f docker-compose.yml -f docker-compose.dev.yml \
            up -d --no-build --no-deps postgres docker-proxy server

      - name: Wait for the API to be healthy
        run: |
          for i in $(seq 1 72); do
            if curl -fsS http://localhost:3000/health >/dev/null 2>&1; then
              echo "API healthy after ~$((i * 5))s"; exit 0
            fi
            sleep 5
          done
          echo "::error::API never became healthy"; exit 1

      - name: Wait for the dashboard (vite) to serve
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:5173/ >/dev/null 2>&1; then exit 0; fi
            sleep 2
          done
          echo "::error::dashboard never served"; exit 1

      - name: Run the smoke suite
        run: npm run e2e

      - name: Stack logs on failure
        if: failure()
        working-directory: docker
        run: |
          docker compose --env-file ../.env \
            -f docker-compose.yml -f docker-compose.dev.yml \
            logs --tail=200 server

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
          if-no-files-found: ignore

      - name: Tear down
        if: always()
        working-directory: docker
        run: |
          docker compose --env-file ../.env \
            -f docker-compose.yml -f docker-compose.dev.yml down -v
