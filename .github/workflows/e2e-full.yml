name: e2e-full

# The full, heavy E2E: the first-run smoke AND the chat round-trip (mock LLM +
# a REAL agent container). It builds the agent image (~5-8 min), so it is NOT an
# every-PR gate — the lightweight first-run smoke (e2e.yml) covers PRs.
#
# Two entry points:
#   - workflow_call  — release.yml uses this as a blocking gate before publish,
#                      so a broken setup/login/onboarding/chat stops the release.
#   - workflow_dispatch — run it by hand any time (e.g. before tagging).
on:
  workflow_call:
  workflow_dispatch:

concurrency:
  group: e2e-full-${{ github.ref }}
  cancel-in-progress: true

jobs:
  full:
    name: first-run + chat (mock LLM + real agent)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
      - run: npm install
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Generate a fresh .env (random secrets)
        run: |
          cp .env.example .env
          sed -i "s|^ENCRYPTION_KEY=.*|ENCRYPTION_KEY=$(openssl rand -hex 16)|" .env
          sed -i "s|^BETTER_AUTH_SECRET=.*|BETTER_AUTH_SECRET=$(openssl rand -hex 32)|" .env
          sed -i "s|^POSTGRES_PASSWORD=.*|POSTGRES_PASSWORD=$(openssl rand -hex 16)|" .env

      # The chat path spawns vonzio-agent:latest; scripts/e2e-local.sh builds it
      # if absent, but do it explicitly so the timing is its own step.
      - name: Build the agent image
        run: |
          make agent-base-local
          make agent-image

      # Order matters: first-run needs a pristine DB; chat seeds an admin. Each
      # call boots its own isolated throwaway stack and tears it down.
      - name: first-run smoke
        run: bash scripts/e2e-local.sh first-run

      - name: chat round-trip
        run: bash scripts/e2e-local.sh chat

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-full
          path: playwright-report/
          retention-days: 7
          if-no-files-found: ignore
