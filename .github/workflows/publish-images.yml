name: publish-images

# Publish the multi-arch (amd64 + arm64) runtime images to GHCR so installs can
# PULL instead of build. Order: agent-base first (it's the base), then agent
# FROM the just-published agent-base; server is independent and runs in parallel.
#
# Triggers:
#   - workflow_call: release.yml uses this to publish on a v* tag.
#   - workflow_dispatch: run by hand to (re)publish a given version.
#
# NOTE: GHCR packages are PRIVATE on first push. After the first publish, set
# agent-base / agent / server to public (Package settings → Change visibility)
# so `docker pull` works anonymously for installs.
on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag to publish (e.g. 0.3.9, or a test tag)"
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  agent-base:
    uses: ./.github/workflows/_publish-one-image.yml
    with:
      image: agent-base
      dockerfile: docker/Dockerfile.agent.base
      version: ${{ inputs.version }}
    secrets: inherit

  agent:
    needs: agent-base # FROM ghcr.io/.../agent-base:<version>, which must exist first
    uses: ./.github/workflows/_publish-one-image.yml
    with:
      image: agent
      dockerfile: docker/Dockerfile.agent
      version: ${{ inputs.version }}
      build_args: AGENT_BASE_TAG=${{ inputs.version }}
    secrets: inherit

  server:
    uses: ./.github/workflows/_publish-one-image.yml
    with:
      image: server
      dockerfile: docker/Dockerfile.server
      version: ${{ inputs.version }}
      # Bake the release version into the image so /health (and the dashboard)
      # report it instead of the Dockerfile's ARG default ("dev"). Only
      # Dockerfile.server declares this ARG, so it's scoped to this job.
      build_args: VONZIO_VERSION=${{ inputs.version }}
    secrets: inherit
