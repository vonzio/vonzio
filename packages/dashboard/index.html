<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Resolve the theme BEFORE first paint to avoid a flash. The stored
         preference is auto|light|dark (legacy carbon/paper still honored);
         `auto` (and the no-choice default) follow the OS via prefers-color-scheme. -->
    <script>
      (function () {
        var mode = "auto";
        try {
          var s = localStorage.getItem("vonzio_surface");
          if (s === "auto" || s === "light" || s === "dark") mode = s;
          else if (s === "carbon") mode = "dark";
          else if (s === "paper") mode = "light";
        } catch (e) { /* private mode, etc. */ }
        var surface =
          mode === "light" ? "paper" :
          mode === "dark" ? "carbon" :
          (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "carbon" : "paper");
        document.documentElement.dataset.surface = surface;
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@300;400;500;600;700&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet" />
    <link rel="icon" type="image/svg+xml" href="/brand/logo/favicon.svg" />
    <link rel="apple-touch-icon" href="/brand/logo/apple-touch-icon.svg" />
    <title>vonzio</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
