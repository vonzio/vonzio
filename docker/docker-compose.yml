# Project name → container/image/group prefix. Without this, Compose defaults to
# the directory it runs from ("docker/"), so everything shows up as docker-*.
# COMPOSE_PROJECT_NAME (env) or -p still override this — the E2E suites set their
# own isolated project names that way.
name: vonzio

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      - POSTGRES_DB=vonzio
      - POSTGRES_USER=vonzio
      - "POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?required — set in .env or run ./install.sh which generates one with: openssl rand -hex 16}"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - vonzio
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vonzio"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Fronts /var/run/docker.sock with an HTTP allowlist proxy. Core-server
  # talks to it over TCP (DOCKER_HOST=tcp://docker-proxy:2375) instead of
  # mounting the raw socket — so a core-server RCE no longer implies host
  # root via the Docker daemon. The allowlist below mirrors the verbs
  # core-server actually uses (audited via grep of dockerode calls).
  # Pinned to 0.3.0 deliberately — a "latest" image inside a hardening
  # service would defeat the point. See docs/SECURITY_MODEL.md and
  # docs/HARDENING.md for the threat model context.
  docker-proxy:
    image: tecnativa/docker-socket-proxy:0.3.0
    restart: unless-stopped
    # NOTE: `read_only: true` was tried and removed -- the image's
    # entrypoint regenerates /usr/local/etc/haproxy/haproxy.cfg from a
    # baked-in template at startup, and any tmpfs overlay there masks
    # the template. The real security control here is the verb allowlist
    # (env vars below) -- a writable rootfs inside this isolated,
    # single-purpose container adds little risk on top.
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      # POST must be enabled in addition to category toggles for any
      # mutating verb (create/start/stop/remove/exec). Default-deny on
      # everything else (NETWORKS, AUTH, BUILD, CONFIGS, SECRETS, SWARM,
      # SYSTEM, SERVICES, TASKS, etc.).
      CONTAINERS: 1
      EXEC: 1
      IMAGES: 1
      VOLUMES: 1
      EVENTS: 1
      PING: 1
      POST: 1
      # Required for egress enforcement (feature 0005): the orchestrator creates
      # the internal agent network + connects the egress proxy to it via the
      # Networks API. A small incremental grant on top of CONTAINERS+EXEC (which
      # already give full container control). Harmless when EGRESS_ENFORCEMENT is
      # off — the API section is simply never called.
      NETWORKS: 1
    networks:
      - vonzio
    # Deliberately no host port — TCP is reachable only from peers on
    # the vonzio internal network (i.e. server).
    healthcheck:
      # wget is in the BusyBox base. /_ping is always allowed by the
      # proxy when PING=1 and is the canonical Docker daemon liveness
      # probe — same endpoint dockerode's docker.ping() hits.
      test: ["CMD-SHELL", "wget -q -O- http://localhost:2375/_ping || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  server:
    build:
      context: ..
      dockerfile: docker/Dockerfile.server
    volumes:
      # docker.sock is intentionally NOT mounted here — core-server talks
      # to the daemon through docker-proxy below. Restoring the raw mount
      # would undo the Phase 2B hardening; do not add it back.
      - vonzio-data:/app/data
      # config/ (system prompt) + tools/ are BAKED INTO the server image
      # (see docker/Dockerfile.server), so the base + pull stacks are
      # self-contained and need no source tree. The dev overlay bind-mounts
      # the repo copies over them for live editing; self-hosters who want to
      # customize without rebuilding can add the same mounts (docs/SELF_HOST.md).
    ports:
      # API + dashboard preview proxy reachable directly on the host. In
      # OSS dev/local self-host this is the user-visible endpoint. Prod
      # deployments using docker-compose.prod.yml add Traefik on top for
      # real-domain HTTPS termination.
      - "${SERVER_PORT:-3000}:3000"
    environment:
      # ENCRYPTION_KEY + BETTER_AUTH_SECRET are credential vault keys.
      # If they change between boots, every encrypted row in the DB
      # becomes undecryptable (AES-GCM auth-tag mismatch). The `:?required`
      # syntax makes compose hard-fail before container start instead of
      # silently falling back to a placeholder string -- the foot-gun
      # that originally surfaced these as known limitations in
      # docs/SECURITY_MODEL.md. Generate via the install.sh script or
      # manually with the openssl invocations shown in the error text.
      - "ENCRYPTION_KEY=${ENCRYPTION_KEY:?required — set in .env or run ./install.sh which generates one with: openssl rand -hex 32}"
      - "BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET:?required — set in .env or run ./install.sh which generates one with: openssl rand -hex 32}"
      - BETTER_AUTH_URL=${BETTER_AUTH_URL:-http://localhost:3000}
      # Extra trusted browser origins (comma-separated) for CORS + better-auth.
      # Documented in .env.example and written by install.sh, but was never
      # passed through to the container — so a self-hoster setting it saw it
      # silently ignored. Defaults to "*" in config when unset (single-origin
      # localhost dev), same as before.
      - CORS_ORIGIN=${CORS_ORIGIN:-*}
      - REGISTRATION_ENABLED=${REGISTRATION_ENABLED:-false}
      # Shared cap (MB) for chat attachments + Files-panel uploads. Raise on a
      # host that needs to push large files into a workspace.
      - MAX_UPLOAD_MB=${MAX_UPLOAD_MB:-100}
      # Override the ChatGPT-subscription (Codex) model list shown in the picker
      # (comma-separated ids) — lets an operator surface a newly-shipped Codex
      # model without a release. Empty = the baked-in default set.
      - CODEX_MODELS=${CODEX_MODELS:-}
      - "DATABASE_URL=postgres://vonzio:${POSTGRES_PASSWORD:?required — set in .env}@postgres:5432/vonzio"
      # Route Docker API through the socket-proxy (see docker-proxy service
      # above). DOCKER_HOST takes precedence over DOCKER_SOCKET in
      # core-server's config resolver.
      - DOCKER_HOST=tcp://docker-proxy:2375
      # Plugin loader: comma-separated list of plugin packages to mount
      # at boot. See packages/core-server/src/plugins/loader.ts.
      - VONZIO_PLUGINS=${VONZIO_PLUGINS:-@vonzio/plugin-telegram,@vonzio/plugin-slack}
      - AGENT_IMAGE=vonzio-agent:latest
      - DOCKER_ENABLED=true
      # The network agents attach to. Interpolated so multiple vonzio instances
      # on one host get their OWN network (install.sh sets VONZIO_NETWORK per
      # install). Defaults to vonzio-network for a single default install.
      # MUST match the `name:` under `networks:` below.
      - DOCKER_NETWORK=${VONZIO_NETWORK:-vonzio-network}
      # Same per-instance treatment for the egress network (install.sh sets
      # EGRESS_PROXY_NETWORK=<project>-egress). Without this passthrough the
      # server's config default ("vonzio-egress") diverges from the network
      # compose actually created below.
      - EGRESS_PROXY_NETWORK=${EGRESS_PROXY_NETWORK:-vonzio-egress}
      # Docker-in-Docker access (feature 0001) — off by default. Set to
      # dind-privileged (single-tenant/own-box) or sysbox (needs Sysbox on the
      # host) to let profiles flagged docker_access run nested compose stacks. The
      # socket-proxy passes privileged creates (endpoint-level filtering), so no
      # raw-socket exposure is needed. See docs/SELF_HOST.md.
      - DOCKER_ACCESS_MODE=${DOCKER_ACCESS_MODE:-off}
      - CONTAINER_MEMORY_LIMIT_DOCKER_ACCESS=${CONTAINER_MEMORY_LIMIT_DOCKER_ACCESS:-8g}
      - CONTAINER_PIDS_LIMIT_DOCKER_ACCESS=${CONTAINER_PIDS_LIMIT_DOCKER_ACCESS:-4096}
      - LOG_LEVEL=info
      - PORT=3000
      - HOST=0.0.0.0
      - POOL_MIN_SIZE=2
      - POOL_MAX_SIZE=5
      - SESSION_IDLE_TTL_SECS=1800
      - MAX_SESSION_CONTAINERS=10
      # Path-mode preview: agent dev servers are reachable through the
      # server's /preview/{container_id}/{port}/ route. No wildcard DNS
      # or reverse proxy required — works on stock localhost.
      - PREVIEW_MODE=path
      # Overridable so the installer can bump the host API port (the container
      # still listens on 3000; this is the host-facing URL agents hand back).
      - PREVIEW_URL_TEMPLATE=${PREVIEW_URL_TEMPLATE:-http://localhost:3000/preview/{container_id}/{port}/}
    depends_on:
      agent:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      docker-proxy:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - vonzio
      # Also join the egress network so core-server can reach egress-enforced
      # agent containers for the hostname preview / file proxy. Feature 0005
      # isolates agents on the internal `vonzio-egress` network; without
      # core-server also being on it, preview URLs (<container>-<port>.DOMAIN)
      # time out because core-server (on `vonzio` only) can't route to the
      # agent's IP. Harmless when egress is off (network is just empty).
      - vonzio-egress

  agent:
    build:
      context: ..
      dockerfile: docker/Dockerfile.agent
    image: vonzio-agent:latest
    entrypoint: ["echo", "Agent image built"]
    networks:
      - vonzio

  # Egress enforcement point (feature 0005). Long-lived, always-on when the
  # `egress` profile is active (enforcement deploys set COMPOSE_PROFILES=egress).
  # Dual-homed: `vonzio` gives it internet (NAT) for upstream; `vonzio-egress`
  # is the internal (no-direct-internet) network agents sit on — they reach it
  # by its service name `egress-proxy`. Run as a service (not created by the
  # orchestrator) so it survives server restarts/crashes and never strands a
  # running agent. Secret = ENCRYPTION_KEY (the server signs tokens with the
  # same); override only by setting EGRESS_PROXY_SECRET on BOTH this service and
  # the server.
  egress-proxy:
    build:
      context: ..
      dockerfile: docker/Dockerfile.egress-proxy
    image: ${EGRESS_PROXY_IMAGE:-vonzio-egress-proxy:latest}
    restart: unless-stopped
    profiles: ["egress"]
    environment:
      - "EGRESS_PROXY_SECRET=${ENCRYPTION_KEY:?required — set in .env or run ./install.sh}"
      - EGRESS_PROXY_PORT=8080
    labels:
      - managed-by=vonzio
      - vonzio-mode=egress-proxy
    networks:
      - vonzio
      - vonzio-egress

  # Flavored agent images (build individually with: docker compose build agent-go)
  agent-go:
    build:
      context: ..
      dockerfile: docker/Dockerfile.agent.go
    image: vonzio-agent:go
    entrypoint: ["echo", "Go agent image built"]
    depends_on:
      agent:
        condition: service_completed_successfully
    profiles: ["flavors"]

  agent-rust:
    build:
      context: ..
      dockerfile: docker/Dockerfile.agent.rust
    image: vonzio-agent:rust
    entrypoint: ["echo", "Rust agent image built"]
    depends_on:
      agent:
        condition: service_completed_successfully
    profiles: ["flavors"]

  agent-python-data:
    build:
      context: ..
      dockerfile: docker/Dockerfile.agent.python-data
    image: vonzio-agent:python-data
    entrypoint: ["echo", "Python data agent image built"]
    depends_on:
      agent:
        condition: service_completed_successfully
    profiles: ["flavors"]

  agent-java:
    build:
      context: ..
      dockerfile: docker/Dockerfile.agent.java
    image: vonzio-agent:java
    entrypoint: ["echo", "Java agent image built"]
    depends_on:
      agent:
        condition: service_completed_successfully
    profiles: ["flavors"]

  # Docker-in-Docker flavor (feature 0001): adds dockerd + CLI + compose so a
  # profile with docker_access can build images / run compose stacks. Only
  # meaningful when the host sets DOCKER_ACCESS_MODE (sysbox or dind-privileged).
  agent-dind:
    build:
      context: ..
      dockerfile: docker/Dockerfile.agent.dind
    image: vonzio-agent:dind
    entrypoint: ["echo", "Docker-in-Docker agent image built"]
    depends_on:
      agent:
        condition: service_completed_successfully
    profiles: ["flavors"]

networks:
  vonzio:
    # Per-instance network name so multiple vonzio installs on one host don't
    # collide (install.sh sets VONZIO_NETWORK=<project>-network). Defaults to
    # vonzio-network. MUST match DOCKER_NETWORK on the server service above.
    name: ${VONZIO_NETWORK:-vonzio-network}
  # Internal (no-direct-internet) network for egress-enforced agents (feature
  # 0005). `internal: true` means the only way out is the dual-homed egress
  # proxy. Name MUST match the server's EGRESS_PROXY_NETWORK. Only used when the
  # `egress` profile is active.
  vonzio-egress:
    name: ${EGRESS_PROXY_NETWORK:-vonzio-egress}
    internal: true

volumes:
  vonzio-data:
  pgdata:
